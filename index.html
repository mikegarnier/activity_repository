<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Science Activities</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #111;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 3rem;
    }

    p {
      text-align: center;
      color: #555;
      font-size: 1.2rem;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 30px;
    }

    li {
      margin: 10px 0;
      padding: 14px 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      font-size: 1.2rem;
    }

    a {
      text-decoration: none;
      color: #0066cc;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    .status {
      text-align: center;
      margin-top: 30px;
      color: #666;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>
  <h1>Physics Activity Simulations</h1>
  <p>Click any activity below to open it.</p>

  <div class="status" id="status">Loading activities...</div>
  <ul id="activityList"></ul>

  <script>
    const activityList = document.getElementById("activityList");
    const status = document.getElementById("status");

    function prettyName(folderName) {
      return folderName
        .replaceAll("_", " ")
        .replaceAll("-", " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    async function loadActivities() {
      try {
        const response = await fetch("activities.json");

        if (!response.ok) {
          throw new Error(`Could not load activities.json: ${response.status}`);
        }

        const activities = await response.json();

        if (!Array.isArray(activities) || activities.length === 0) {
          status.textContent = "No activities found in activities.json.";
          return;
        }

        activityList.innerHTML = "";

        activities.forEach(activity => {
          const folder = activity.folder;
          const title = activity.title || prettyName(folder);

          if (!folder) return;

          const li = document.createElement("li");
          const link = document.createElement("a");

          link.href = `${folder}/`;
          link.textContent = title;

          li.appendChild(link);
          activityList.appendChild(li);
        });

        status.textContent = `Found ${activities.length} activities.`;

      } catch (error) {
        console.error(error);

        status.innerHTML = `
          Could not load activities automatically.<br>
          Make sure <strong>activities.json</strong> exists in the same folder as this index page.
        `;
      }
    }

    loadActivities();
  </script>
</body>
</html>
