<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inquiry Cube</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .viewer-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      --poster-color: transparent;
    }

    .help {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 2;
      background: rgba(255,255,255,0.9);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      line-height: 1.35;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
      pointer-events: none;
    }

    .reset {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      cursor: pointer;
      background: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    }

    .reset:focus-visible {
      outline: 3px solid #222;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="viewer-wrap">
    <model-viewer
      id="viewer"
      src="Inquiry Cube.glb"
      alt="Interactive 3D model of the Inquiry Cube"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="0.5"
      exposure="1"
      interaction-prompt="auto"
      camera-orbit="35deg 70deg 75%"
      min-camera-orbit="auto auto 75%"
      max-camera-orbit="auto auto 75%">
    </model-viewer>

    <div class="help">Drag to rotate • Scroll or pinch to zoom</div>
    <button class="reset" id="resetBtn" type="button">Reset View</button>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const resetBtn = document.getElementById('resetBtn');

    const defaultOrbit = '35deg 70deg 120%';
    const defaultTarget = 'auto auto auto';

    resetBtn.addEventListener('click', () => {
      viewer.cameraOrbit = defaultOrbit;
      viewer.cameraTarget = defaultTarget;
      viewer.jumpCameraToGoal();
    });
  </script>
</body>
</html>
